apiVersion: v1
kind: ResourceQuota
metadata:
  name: x03-resource-quota
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: "512Mi"
    limits.cpu: "2"
    limits.memory: "2Gi"
    pods: "2"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: x03-limit-range
spec:
  limits:
  - default:
      cpu: "1000m"
      memory: "1Gi"
    defaultRequest:
      cpu: "250m"
      memory: "256Mi"
    type: Container
