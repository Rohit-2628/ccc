# Sentinel Base Architecture Configuration File
# Challenge designers can adjust these parameters to scale difficulty or test individual stages.

# Overall challenge difficulty profile: EASY | MEDIUM | HARD
CHALLENGE_DIFFICULTY=HARD

# Stage 1: Restricted Diagnostics Shell
# When enabled, the initial SSH session launches /opt/sentinel/bin/sentinel-shell
# To disable Stage 1 and give direct bash access, set to false.
ENABLE_RESTRICTED_SHELL=true

# Stage 2: Background Internal Telemetry Daemon (sentry-agent)
# Listens on UNIX socket /run/sentinel/sentry.sock
ENABLE_IPC_DAEMON=true
SENTRY_SOCKET=/run/sentinel/sentry.sock
SENTRY_TOKEN_FILE=/var/run/sentinel/sentry.token

# Stage 3: SUID Container Controller Utility
# Controls SUID installation of /opt/sentinel/bin/container-ctl
ENABLE_SUID_CONTROL=true
SUID_BINARY_PATH=/opt/sentinel/bin/container-ctl

# Flag storage location
FLAG_FILE=/root/flag.txt
