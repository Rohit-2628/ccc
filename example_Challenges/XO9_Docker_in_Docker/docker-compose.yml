version: "3.8"

services:
  xo9-honorport-heist:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xo9_honorport_heist
    ports:
      - "8099:8080"
      - "2222:22"
    environment:
      - PORT=8080
      - SSH_PORT=22
      - DOCKER_HOST=tcp://127.0.0.1:2375
      - FLAG=YUVA{d1nd_h0n0rp0rt_h31st_d0ck3r_1n_d0ck3r_x09}
    restart: unless-stopped
