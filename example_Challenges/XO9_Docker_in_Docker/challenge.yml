name: "XO-9: Honorport Heist"
author: "CTF Challenge Engineering Team"
category: "CI/CD & DinD Security"
description: |
  XO-9: Honorport Heist (Docker-in-Docker Security).
  Connect to the Honorport Web Gateway on TCP/80 or SSH Gateway on TCP/22, exploit container deployment parameter injection, pivot through the inner Docker-in-Docker daemon, inspect cached container registry images and history layers, extract the Harbor Master signing key, and capture the Honorport Mainframe Vault secret.
value: 500
type: standard
flags:
  - YUVA{d1nd_h0n0rp0rt_h31st_d0ck3r_1n_d0ck3r_x09}

tags:
  - dind
  - docker
  - ci-cd
  - container-forensics
  - privilege-escalation

hints:
  - text: "Inspect inner Docker daemon images and inspect image history layers for residual secrets."
    cost: 50
  - text: "Use HMAC-SHA256 with VAULT_HMAC_SECRET_KEY to calculate the authorization signature."
    cost: 100

state: visible
version: "1.0"

docker:
  image: xo9-honorport-heist
  ports:
    - 80
    - 22
