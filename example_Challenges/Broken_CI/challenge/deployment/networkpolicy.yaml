apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: x04-broken-ci-netpol
  namespace: team-sandbox
spec:
  podSelector:
    matchLabels:
      app: x04-broken-ci
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from CTF platform gateway on HTTP (80) and SSH (22)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-gateway
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 22
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
