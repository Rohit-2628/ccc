apiVersion: v1
kind: ResourceQuota
metadata:
  name: x04-broken-ci-quota
  namespace: team-sandbox
spec:
  hard:
    requests.cpu: "2000m"
    requests.memory: "2Gi"
    limits.cpu: "4000m"
    limits.memory: "4Gi"
    requests.ephemeral-storage: "4Gi"
    limits.ephemeral-storage: "8Gi"
    pods: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: x04-broken-ci-limits
  namespace: team-sandbox
spec:
  limits:
    - default:
        cpu: "2000m"
        memory: "2Gi"
      defaultRequest:
        cpu: "500m"
        memory: "512Mi"
      type: Container
