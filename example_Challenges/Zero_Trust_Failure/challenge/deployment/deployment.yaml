apiVersion: apps/v1
kind: Deployment
metadata:
  name: x10-zero-trust-failure
  namespace: team-sandbox
  labels:
    app.kubernetes.io/name: x10-zero-trust-failure
    app.kubernetes.io/part-of: latveria-citadel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: x10-zero-trust-failure
  template:
    metadata:
      labels:
        app.kubernetes.io/name: x10-zero-trust-failure
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: zero-trust-failure
          image: latveria-registry.local/challenges/x10-zero-trust-failure:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          env:
            - name: PORT
              value: "80"
            - name: FLAG
              value: "YUVA{z3r0_trust_f41lur3_s3rv1c3_1d3nt1ty_x10}"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: ephemeral-state
              mountPath: /tmp
      volumes:
        - name: ephemeral-state
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
