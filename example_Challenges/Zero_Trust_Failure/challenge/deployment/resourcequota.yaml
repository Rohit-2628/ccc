apiVersion: v1
kind: ResourceQuota
metadata:
  name: x10-zero-trust-failure-quota
  namespace: team-sandbox
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: "512Mi"
    limits.cpu: "2000m"
    limits.memory: "1Gi"
    pods: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: x10-zero-trust-failure-limits
  namespace: team-sandbox
spec:
  limits:
    - default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      type: Container
