apiVersion: v1
kind: ResourceQuota
metadata:
  name: x02-microservice-trust-quota
spec:
  hard:
    requests.cpu: "1000m"
    requests.memory: "512Mi"
    limits.cpu: "2000m"
    limits.memory: "1Gi"
    pods: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: x02-microservice-trust-limits
spec:
  limits:
  - default:
      cpu: "500m"
      memory: "256Mi"
    defaultRequest:
      cpu: "100m"
      memory: "128Mi"
    type: Container
